<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Welcare Sanitech: menstrual health, reusable sanitary pads, and pocket hand sanitizer."
    />
    <meta name="theme-color" content="#f7faf5" />
    <title>Welcare Sanitech | Project Presentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#presentation" aria-label="Welcare Sanitech home">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span>Welcare Sanitech</span>
      </a>
      <div class="topbar-actions">
        <span class="deck-label">Project presentation</span>
        <button class="edit-button" id="edit-button" type="button">Edit slides</button>
      </div>
    </header>

    <main id="presentation" class="presentation">
      <div class="deck-shell">
        <div class="slide-stage" id="slide-stage" aria-live="polite"></div>
        <div class="deck-controls" aria-label="Presentation controls">
          <button class="nav-button" id="previous-button" type="button" aria-label="Previous slide">
            <span aria-hidden="true">&larr;</span>
            <span class="control-text">Previous</span>
          </button>
          <div class="slide-progress">
            <div class="slide-dots" id="slide-dots" aria-label="Choose a slide"></div>
            <p id="slide-count" class="slide-count" aria-live="polite"></p>
          </div>
          <button class="nav-button next-button" id="next-button" type="button" aria-label="Next slide">
            <span class="control-text">Next</span>
            <span aria-hidden="true">&rarr;</span>
          </button>
        </div>
        <p class="keyboard-hint">Use your arrow keys to move between slides</p>
      </div>
    </main>

    <footer class="site-footer">
      <span>Welcare Sanitech</span>
      <div class="contact-links">
        <a href="mailto:puotmalouyien@gmail.com">puotmalouyien@gmail.com</a>
        <a href="tel:+25498565702">+25498565702</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
